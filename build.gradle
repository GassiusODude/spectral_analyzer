plugins {
	id 'java'
	id 'application'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openjfx.javafxplugin' version '0.1.0'
	id "com.gradleup.shadow" version "9.3.1"
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.26' // Third-party plugin
}

group = 'net.kcundercover'
version = '0.5.0'
description = 'Spectral Analysis implementation in JavaFX'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// ============================================================================
// 				Dynamically Identify the Container OS at Compile Time
// ============================================================================
def currentOs = System.getProperty("os.name").toLowerCase()
def targetPlatform = currentOs.contains("win") ? "win" : currentOs.contains("linux") ? "linux" : "mac"

logger.lifecycle("🚀 CI/CD Pipeline Detected Container OS: ${targetPlatform.toUpperCase()}")


javafx {
    version = "21.0.10"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

// ============================================================================
// 									bootJar
// ============================================================================
// NOTE: Set up bootJar to support the Spring boot JavaFX application
bootJar {
	// Detect OS for naming
    // def os = System.getProperty("os.name").toLowerCase()
    // def platform = os.contains("win") ? "win" : os.contains("linux") ? "linux" : "mac"

    // // label archive based on operating system
    // archiveClassifier = "boot-${platform}" // Result: -boot-win or -boot-linux

    // Explicitly names your artifacts based on the active container (e.g., -boot-win.jar)
    archiveClassifier = "boot-${targetPlatform}"
    manifest {
        attributes(
            "Implementation-Title": "Spectral Analyzer",
            "Implementation-Version": project.version,
            "Build-Timestamp": new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date())
        )
    }

    // Include your licenses in the BOOT-INF/classes/META-INF folder
    from("${project.rootDir}") {
        include "LICENSE"

		// EJML, Apache Common Math, Jackson, Spring Framwork/Boot
        include "APACHE_LICENSE-2.0.txt"

		// JFreeChart and JFreeChart-FX
		include "JFREECHART_LICENSE-LGPL.txt"

        into "META-INF"
    }
}

shadowJar {
    archiveClassifier = "shaded-${targetPlatform}"
    mergeServiceFiles()
    append 'META-INF/spring.handlers'
    append 'META-INF/spring.schemas'
}

