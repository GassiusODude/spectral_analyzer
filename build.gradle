configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}


// ============================================================================
// 					Specify dependencies and repositories
// ============================================================================
repositories {
	// Use local maven repo if available (for JDSP dependency)
	mavenLocal()

    mavenCentral()

	// Jitpack.io
	maven { url 'https://jitpack.io'}
}

dependencies {
    def javafxVersion = "21.0.2" // Match your Java version
    // def platforms = ['win', 'linux', 'mac']

    // platforms.each { platform ->
    //     implementation "org.openjfx:javafx-controls:${javafxVersion}:${platform}"
    //     implementation "org.openjfx:javafx-graphics:${javafxVersion}:${platform}"
    //     implementation "org.openjfx:javafx-fxml:${javafxVersion}:${platform}"

    //     // Add others like javafx-media if needed
    // }

    // Instead of looping all platforms, this ONLY grabs the active runner's files
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${targetPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${targetPlatform}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${targetPlatform}"

     // --- NATIVE SYSTEM DRIVERS ---
    // JNA packages are extremely lightweight (<5MB) and dynamically bundle
    // native drivers for BOTH Windows (.dll) and Linux (.so) profiles.
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'

    // --- Common CORE libraries ---
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'net.rgielen:javafx-weaver-spring-boot-starter:2.0.1'

	// Fast plotting library
    implementation 'org.jfree:jfreechart:1.5.4'
    implementation 'org.jfree:org.jfree.chart.fx:2.0.1'

	// JDSP (resampling, PSD)
	// implementation 'net.kcundercover:jdsp:1.3'
	implementation 'com.github.GassiusODude:jdsp:v1.3.1'		// pulling with jitpack.io

	// Jackson (JSON support to read SigMF Meta)
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Common Math (FFT)
	implementation 'org.apache.commons:commons-math3:3.6.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'net.kcundercover.spectral_analyzer.SpectralAnalyzerApplication'

    // Points to our wrapper launcher to dodge the native classloader bug on Ubuntu
    // mainClass = 'net.kcundercover.spectral_analyzer.JarLauncher'
}

// Optional: Configure them to show HTML reports
checkstyle {
    toolVersion = "10.12.5"
    ignoreFailures = false
	showViolations = true
	configProperties = [
        'org.checkstyle.google.severity': 'warning',
        'org.checkstyle.google.suppressionfilter.config': "${project.rootDir}/config/checkstyle/checkstyle-suppressions.xml"
    ]
}

spotbugs {
    toolVersion = '4.8.3'
}

tasks.named('test') {
	useJUnitPlatform()
}
